version: '3'

env:
  CGO_ENABLED: '0'

vars:
  VERSION:
    sh: |
      dirty_suffix=$(test -z "$(git status --porcelain 2>/dev/null)" || printf '*')
      description=$(git describe --tags --always 2>/dev/null || printf 'devel')
      version=$(printf '%s\n' "$description" | sed -E 's/^(v[0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g[0-9a-f]+$/\1.\2/')
      printf '%s%s\n' "$version" "$dirty_suffix"
  COMMIT_HASH:
    sh: git rev-parse HEAD 2>/dev/null || printf unknown
  COMMIT_DATE:
    sh: TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d HEAD 2>/dev/null || printf unknown
  LDFLAGS: >-
    -X github.com/kwo/mtrxmsg/pkg/version.buildVersion={{.VERSION}}
    -X github.com/kwo/mtrxmsg/pkg/version.buildCommitHash={{.COMMIT_HASH}}
    -X github.com/kwo/mtrxmsg/pkg/version.buildCommitDate={{.COMMIT_DATE}}

tasks:
  default:
    cmds:
      - task: build
  build:
    desc: Build mtrxmsg
    cmds:
      - go build -tags goolm -trimpath -buildvcs=false -ldflags "{{.LDFLAGS}}" -o mtrxmsg .
  test:
    desc: Run the tests
    cmds:
      - go test -tags goolm ./...
  lint:
    desc: Check the Go code
    cmds:
      - go tool golangci-lint run --build-tags goolm {{.CLI_ARGS}}
